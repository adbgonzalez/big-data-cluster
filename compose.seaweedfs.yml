services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: seaweedfs
    networks: [cluster]
    command: ["mini", "-dir=/data"]
    ports:
      - "127.0.0.1:${S3_API_HOST_PORT:-9002}:8333"
      - "127.0.0.1:${S3_ADMIN_HOST_PORT:-9001}:23646"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: spark
    volumes:
      - seaweedfs_data:/data

  aws-cli:
    image: public.ecr.aws/aws-cli/aws-cli:2.27.41
    profiles: [tools]
    networks: [cluster]
    entrypoint: ["aws", "--endpoint-url", "http://seaweedfs:8333"]
    command: ["--version"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ""
    working_dir: /aws
    volumes:
      - ../spark-notebooks/data:/aws

volumes:
  seaweedfs_data:

